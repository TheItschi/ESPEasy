# Builds a small custom ESP8266 firmware with the PCD8544/ST7567 display plugin (P141).
# src/Custom.h is gitignored, so the tracked tools/ci/custom/Custom_LCD.h is copied in before the build.

name: Build custom P141 ST7567

on:
  push:
    branches: [lcd-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: custom_312_ESP8266_4M1M  # ST7567 explicitly enabled
            st7567: '1'
          - env: custom_274_ESP8266_1M    # default for ESP8266: ST7567 disabled
            st7567: ''
          - env: custom_ESP32_4M316k      # default for ESP32: ST7567 enabled
            st7567: ''
          - env: minimal_core_312_ESP8266_1M_OTA_FHEM_HA  # failed in upstream CI (lib_ignore)
            st7567: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install dependencies
        run: |
          uv pip install --system pioarduino
          uv pip install --system -r requirements.txt
      - name: Use custom build config
        run: |
          cp tools/ci/custom/Custom_LCD.h src/Custom.h
          if [ -n "${{ matrix.st7567 }}" ]; then echo "#define P141_FEATURE_ST7567 ${{ matrix.st7567 }}" >> src/Custom.h; fi
      - name: Run PlatformIO
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v7
        with:
          name: ESPEasy-LCD-${{ matrix.env }}-${{ github.run_number }}
          path: ./build_output/bin
          if-no-files-found: error
