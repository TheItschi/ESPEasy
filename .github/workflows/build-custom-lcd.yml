# Builds a small custom ESP8266 firmware with the PCD8544/ST7567 display plugin (P141).
# src/Custom.h is gitignored, so the tracked tools/ci/custom/Custom_LCD.h is copied in before the build.

name: Build custom P141 ST7567

on:
  push:
    branches: [lcd-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [custom_312_ESP8266_4M1M, custom_ESP32_4M316k]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install dependencies
        run: |
          uv pip install --system pioarduino
          uv pip install --system -r requirements.txt
      - name: Use custom build config
        run: cp tools/ci/custom/Custom_LCD.h src/Custom.h
      - name: Run PlatformIO
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v7
        with:
          name: ESPEasy-LCD-${{ matrix.env }}-${{ github.run_number }}
          path: ./build_output/bin
          if-no-files-found: error
